<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>🖨️ JONH — Impression automatique Sherbrooke</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 960px;
    margin: 20px auto;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  h1 {
    margin: 0 0 6px 0;
    color: #5b8c1f;
    border-bottom: 3px solid #5b8c1f;
    padding-bottom: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin: 20px 0;
  }
  .stat {
    background: #f8f8f8;
    border-left: 4px solid #ccc;
    padding: 12px 14px;
    border-radius: 6px;
  }
  .stat.ok   { border-left-color: #4caf50; background: #eaf5ea; }
  .stat.warn { border-left-color: #ff9800; background: #fff4e5; }
  .stat.err  { border-left-color: #f44336; background: #fdeaea; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #777; }
  .stat .val   { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .actions { margin: 16px 0; display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    padding: 10px 18px;
    border: 0;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-go   { background: #4caf50; color: #fff; }
  .btn-stop { background: #ddd; color: #444; }
  .btn-test { background: #eee; color: #333; }
  .btn-clr  { background: #f44336; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .config {
    background: #eef4fb;
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
    color: #365a7e;
    margin: 10px 0;
  }
  .config code { background: #fff; padding: 1px 6px; border-radius: 3px; }
  .log {
    background: #1e1e1e;
    color: #e0e0e0;
    padding: 14px;
    border-radius: 6px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px;
    height: 460px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .log .t { color: #888; margin-right: 6px; }
  .log .ok { color: #81c784; }
  .log .er { color: #ef9a9a; }
  .log .wa { color: #ffcc80; }
  .log .in { color: #64b5f6; }
</style>

<!-- QZ Tray library -->
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
</head>

<body>
<div class="card">
  <h1>🖨️ JONH — Impression automatique Sherbrooke</h1>

  <div class="grid">
    <div class="stat" id="s-qz">
      <div class="label">QZ Tray</div>
      <div class="val" id="s-qz-v">Non connecté</div>
    </div>
    <div class="stat" id="s-pr">
      <div class="label">Imprimante</div>
      <div class="val" id="s-pr-v">—</div>
    </div>
    <div class="stat" id="s-su">
      <div class="label">Surveillance</div>
      <div class="val" id="s-su-v">Arrêtée</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-go"   id="btn-start">▶ Démarrer</button>
    <button class="btn-stop" id="btn-stop" disabled>⏸ Arrêter</button>
    <button class="btn-test" id="btn-test">🧪 Imprimer un test</button>
    <button class="btn-clr"  id="btn-clear">🗑 Effacer log</button>
  </div>

  <div class="config">
    <strong>Configuration :</strong><br/>
    Site : <code id="cfg-site">sherbrooke</code> |
    Imprimante : <code id="cfg-printer">MF650C Series</code> |
    Intervalle : <code id="cfg-int">15 secondes</code> |
    Worker : <code id="cfg-worker">zoho-proxy.conception.workers.dev</code>
  </div>

  <div id="log" class="log"></div>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const CONFIG = {
  site: "sherbrooke",
  printerName: "MF650C Series",
  workerUrl: "https://zoho-proxy.conception.workers.dev",
  localPath: "Z:\\Zoho Projects\\JO-18-Dessins Sherbrooke-Attachments\\",
  pollIntervalMs: 15000,
  autoStart: true   // démarre tout seul au chargement de la page
};

// ============================================================
// ÉTAT GLOBAL
// ============================================================
let pollTimer = null;
let surveillanceActive = false;
const processedIds = new Set(); // pour éviter les doublons

// ============================================================
// LOGGING
// ============================================================
const logEl = document.getElementById("log");
function log(msg, type = "") {
  const now = new Date();
  const t = now.toLocaleTimeString("fr-CA");
  const cls = type === "ok" ? "ok" : type === "er" ? "er" : type === "wa" ? "wa" : "in";
  logEl.innerHTML += `<span class="t">${t}</span><span class="${cls}">${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function setStat(id, value, cls) {
  document.getElementById("s-" + id + "-v").textContent = value;
  const el = document.getElementById("s-" + id);
  el.classList.remove("ok", "warn", "err");
  if (cls) el.classList.add(cls);
}

// ============================================================
// QZ TRAY — connexion
// ============================================================
async function connectQz() {
  if (qz.websocket.isActive()) {
    log("✅ QZ Tray déjà connecté", "ok");
    return true;
  }
  try {
    // Accepte tout certificat (Community Edition — popup de confirmation par défaut)
    qz.security.setCertificatePromise(res => res());
    qz.security.setSignaturePromise(() => (res, rej) => res());

    log("🔗 Connexion à QZ Tray...", "in");
    await qz.websocket.connect();
    log("✅ Connecté à QZ Tray", "ok");
    setStat("qz", "Connecté", "ok");

    // Vérifier l'imprimante
    const printers = await qz.printers.find();
    log(`Imprimantes détectées : ${printers.length}`, "in");
    const match = printers.find(p => p.toLowerCase().includes(CONFIG.printerName.toLowerCase()));
    if (match) {
      log(`✅ Imprimante trouvée : ${match}`, "ok");
      setStat("pr", match, "ok");
      CONFIG.printerName = match; // on garde le nom exact
    } else {
      log(`⚠️ Imprimante "${CONFIG.printerName}" non trouvée`, "wa");
      setStat("pr", "Non trouvée", "warn");
    }
    return true;
  } catch (e) {
    log("❌ Erreur QZ Tray : " + e, "er");
    setStat("qz", "Erreur", "err");
    return false;
  }
}

// ============================================================
// POLLING — récupérer les jobs du Worker
// ============================================================
async function pollQueue() {
  try {
    const url = `${CONFIG.workerUrl}/print-queue?site=${CONFIG.site}`;
    const r = await fetch(url);
    if (!r.ok) {
      log(`⚠️ Polling erreur HTTP ${r.status}`, "wa");
      return;
    }
    const data = await r.json();
    const jobs = data.jobs || data.files || [];

    if (jobs.length === 0) return;

    log(`🔔 ${jobs.length} job(s) à traiter`, "in");

    for (const job of jobs) {
      if (processedIds.has(job.id)) {
        log(`↪ Job ${job.id} déjà traité, on ignore`, "wa");
        continue;
      }
      processedIds.add(job.id);
      await processJob(job);
    }
  } catch (e) {
    log("❌ Erreur polling : " + e.message, "er");
  }
}

// ============================================================
// TRAITER UN JOB = imprimer tous ses PDFs
// ============================================================
async function processJob(job) {
  const fileNames = job.fileNames || [];
  const taskName = job.taskName || "Tâche inconnue";

  log(`📋 Job : ${taskName} (${fileNames.length} fichier${fileNames.length > 1 ? "s" : ""})`, "in");

  let okCount = 0;
  let errCount = 0;

  for (const fileName of fileNames) {
    const fullPath = CONFIG.localPath + fileName;
    log(`📄 Impression : ${fileName}`, "in");
    log(`   Chemin : ${fullPath}`, "in");

    try {
      const config = qz.configs.create(CONFIG.printerName);
      const dataPrint = [{
        type: "pixel",
        format: "pdf",
        flavor: "file",
        data: fullPath
      }];
      await qz.print(config, dataPrint);
      log(`   ✅ Envoyé à l'imprimante`, "ok");
      okCount++;
    } catch (e) {
      log(`   ❌ Erreur : ${e.message || e}`, "er");
      errCount++;
    }
  }

  log(`📊 ${okCount} réussi(s), ${errCount} échec(s)`, okCount > 0 ? "ok" : "er");

  // Marquer comme traité côté Worker (DELETE)
  if (job.id) {
    try {
      const r = await fetch(`${CONFIG.workerUrl}/print-queue/${job.id}`, { method: "DELETE" });
      if (r.ok) log(`🗑 Job ${job.id} supprimé de la file`, "ok");
      else log(`⚠️ Impossible de supprimer le job (HTTP ${r.status})`, "wa");
    } catch (e) {
      log(`⚠️ Erreur suppression job : ${e.message}`, "wa");
    }
  }
}

// ============================================================
// DÉMARRER / ARRÊTER LA SURVEILLANCE
// ============================================================
async function startSurveillance() {
  if (surveillanceActive) return;
  const ok = await connectQz();
  if (!ok) {
    log("❌ Impossible de démarrer sans QZ Tray", "er");
    return;
  }
  surveillanceActive = true;
  setStat("su", "Active", "ok");
  log(`🚀 Surveillance démarrée (toutes les ${CONFIG.pollIntervalMs / 1000}s)`, "ok");
  document.getElementById("btn-start").disabled = true;
  document.getElementById("btn-stop").disabled = false;
  // Premier poll immédiat puis intervalle
  pollQueue();
  pollTimer = setInterval(pollQueue, CONFIG.pollIntervalMs);
}

function stopSurveillance() {
  if (!surveillanceActive) return;
  surveillanceActive = false;
  clearInterval(pollTimer);
  pollTimer = null;
  setStat("su", "Arrêtée");
  log("⏸ Surveillance arrêtée", "wa");
  document.getElementById("btn-start").disabled = false;
  document.getElementById("btn-stop").disabled = true;
}

// ============================================================
// IMPRIMER UN TEST
// ============================================================
async function printTest() {
  if (!qz.websocket.isActive()) {
    const ok = await connectQz();
    if (!ok) return;
  }
  try {
    log("🧪 Impression test...", "in");
    const config = qz.configs.create(CONFIG.printerName);
    const data = [
      "\n\n=== TEST IMPRESSION JONH ===\n",
      "Site     : " + CONFIG.site + "\n",
      "Date     : " + new Date().toLocaleString("fr-CA") + "\n",
      "Imprimante : " + CONFIG.printerName + "\n\n",
      "Si vous voyez ce message, le système fonctionne ✅\n\n\n"
    ];
    await qz.print(config, data);
    log("✅ Test envoyé à l'imprimante", "ok");
  } catch (e) {
    log("❌ Erreur test : " + e.message, "er");
  }
}

// ============================================================
// BRANCHER LES BOUTONS
// ============================================================
document.getElementById("btn-start").addEventListener("click", startSurveillance);
document.getElementById("btn-stop").addEventListener("click", stopSurveillance);
document.getElementById("btn-test").addEventListener("click", printTest);
document.getElementById("btn-clear").addEventListener("click", () => { logEl.innerHTML = ""; });

// ============================================================
// AUTO-START au chargement de la page
// ============================================================
log("🟢 Page prête", "ok");
if (CONFIG.autoStart) {
  log("⏳ Démarrage automatique dans 3 secondes...", "in");
  setTimeout(startSurveillance, 3000);
}
</script>
</body>
</html>
