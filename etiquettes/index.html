<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étiquettes JONH — Zoho Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Lato', Arial, sans-serif; background: #F5F7FA; padding: 40px 20px; min-height: 100vh; }
.container { max-width: 850px; margin: 0 auto; background: white; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); padding: 36px; }
.header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #6B8C3E; }
.jonh-badge { background: #6B8C3E; color: white; font-weight: 900; font-size: 22px; letter-spacing: 2px; padding: 8px 16px; border-radius: 5px; line-height: 1; }
.header-text h1 { font-size: 20px; font-weight: 700; color: #2C3E50; }
.header-text p  { font-size: 13px; color: #95A5A6; margin-top: 2px; }
.search-box { background: #F8F9FC; border: 1px solid #E5E9F2; border-radius: 6px; padding: 18px; margin-bottom: 20px; }
.search-box h3 { font-size: 13px; font-weight: 700; color: #5A6C7D; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.search-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.search-row label { font-weight: 600; font-size: 13px; color: #5A6C7D; min-width: 60px; }
.search-row input { flex: 1; padding: 10px 14px; border: 1px solid #D1D9E6; border-radius: 4px; font-size: 14px; font-family: 'Lato', sans-serif; color: #2C3E50; min-width: 100px; }
.search-row input:focus { outline: none; border-color: #6B8C3E; }
.btn { padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: 'Lato', sans-serif; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-green { background: #6B8C3E; color: white; }
.btn-green:hover:not(:disabled) { background: #587530; }
.btn-blue { background: #4A90E2; color: white; }
.btn-blue:hover:not(:disabled) { background: #357ABD; }
.btn-grey { background: #E5E9F2; color: #5A6C7D; }
.status { padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-top: 10px; }
.status.success { background: #DFF0D8; color: #3C763D; border: 1px solid #D6E9C6; }
.status.error   { background: #FDECEA; color: #B94A48; border: 1px solid #F5C6CB; }
.status.info    { background: #D9EDF7; color: #31708F; border: 1px solid #BCE8F1; }
.order-card { margin-top: 18px; border: 1px solid #E5E9F2; border-radius: 6px; overflow: hidden; }
.order-card-header { background: #6B8C3E; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.order-num { font-size: 16px; font-weight: 900; }
.order-meta { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.order-count { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
.items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.items-table th { padding: 8px 12px; background: #F0F3F0; color: #5A6C7D; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; }
.items-table td { padding: 9px 12px; border-bottom: 1px solid #F0F3F0; color: #2C3E50; vertical-align: top; }
.items-table tr:last-child td { border-bottom: none; }
.items-table tr.tiroir-row td { background: #F4F8EE; }
.items-table tr.tiroir-row:hover td { background: #EAF2DD; }
.items-table tr.simple-row td { background: #FFFAF0; }
.items-table tr.simple-row:hover td { background: #FFF3DC; }
.item-name { font-weight: 600; font-size: 12px; }
.item-dessin { font-size: 11px; color: #6B8C3E; font-weight: 700; margin-top: 2px; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; margin-right: 6px; vertical-align: middle; text-transform: uppercase; letter-spacing: 0.3px; }
.tag-tiroir { background: #6B8C3E; color: white; }
.tag-simple { background: #E67E22; color: white; }
input[type="checkbox"] { width: 15px; height: 15px; accent-color: #6B8C3E; cursor: pointer; }
.qte-input { width: 60px; padding: 5px 7px; border: 1px solid #D1D9E6; border-radius: 3px; font-size: 13px; text-align: center; font-family: 'Lato', sans-serif; font-weight: 600; }
.qte-input:focus { outline: none; border-color: #6B8C3E; box-shadow: 0 0 0 2px rgba(107,140,62,0.15); }
.qte-input.qte-simple { border-color: #E67E22; background: #FFF; }
.qte-input.qte-simple:focus { border-color: #CA6F1E; box-shadow: 0 0 0 2px rgba(230,126,34,0.2); }
.qte-input.qte-simple::placeholder { color: #E67E22; opacity: 0.6; font-weight: 700; }
.action-bar { padding: 14px 18px; background: #F8F9FC; border-top: 1px solid #E5E9F2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; bottom: 0; z-index: 10; }
.legend { padding: 10px 14px; background: #F8F9FC; border: 1px solid #E5E9F2; border-radius: 4px; font-size: 11px; color: #5A6C7D; margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
.spinner-dark { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #6B8C3E; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   APERÇU À L'ÉCRAN (avant impression)
   ============================================================ */
.apercu-label {
    width: 4in;
    height: 2.875in;
    border: 1px dashed #B0B7C0;
    background: white;
    margin: 0 auto 18px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    padding-top: 0.75in;
    font-family: Arial, sans-serif;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border-radius: 3px;
}
.apercu-label .label-body { flex: 1; padding: 4px 14px 0; overflow: hidden; }
.apercu-label .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.apercu-label .row-item { flex-wrap: nowrap; }
.apercu-label .row-item .item-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.apercu-label .row-top { margin-bottom: 6px; }
.apercu-label .k { font-weight: 700; font-size: 10pt; white-space: nowrap; flex-shrink: 0; }
.apercu-label .v { font-size: 10pt; word-break: break-word; }
.apercu-label .vbig { font-weight: 700; font-size: 11pt; }
.apercu-label .item-v { font-weight: 600; font-size: 9.5pt; }
.apercu-label .ml { margin-left: auto; }
.apercu-label .label-footer { padding: 4px 14px 6px; border-top: 0.5pt solid #999; flex-shrink: 0; position: relative; }
.apercu-label .flags { display: flex; gap: 14px; font-size: 9pt; margin-bottom: 2px; }
.apercu-label .flags b { font-weight: 700; }
.apercu-label .made { font-size: 8pt; color: #555; font-style: italic; }
.apercu-label .nbitem { position: absolute; bottom: 6px; right: 14px; font-size: 9pt; font-weight: 700; }
.apercu-num { text-align: center; font-size: 11px; color: #95A5A6; margin-bottom: 6px; font-weight: 700; }

/* ============================================================
   STYLES IMPRESSION (4" x 2.875" Zebra)
   ============================================================ */
.print-area { display: none; }

@media print {
    body > *:not(.print-area) { display: none !important; }
    body { padding: 0; margin: 0; background: white; }
    .print-area { display: block !important; }
    .container { display: none !important; }

    @page { size: 4in 2.875in; margin: 0; }
    html, body {
        width: 4in;
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .label {
        width: 4in;
        height: 2.875in;
        page-break-after: always;
        page-break-inside: avoid;
        break-inside: avoid;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        padding-top: 0.75in;
        font-family: Arial, sans-serif;
    }
    .label:last-child { page-break-after: auto; }
    .label-body { flex: 1; padding: 4px 14px 0; overflow: hidden; }
    .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
    .row-item { flex-wrap: nowrap; }
    .row-item .item-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .row-top { margin-bottom: 6px; }
    .k { font-weight: 700; font-size: 10pt; white-space: nowrap; flex-shrink: 0; }
    .v { font-size: 10pt; word-break: break-word; }
    .vbig { font-weight: 700; font-size: 11pt; }
    .item-v { font-weight: 600; font-size: 9.5pt; }
    .ml { margin-left: auto; }
    .label-footer { padding: 4px 14px 6px; border-top: 0.5pt solid #999; flex-shrink: 0; position: relative; }
    .flags { display: flex; gap: 14px; font-size: 9pt; margin-bottom: 2px; }
    .flags b { font-weight: 700; }
    .made { font-size: 8pt; color: #555; font-style: italic; }
    .nbitem { position: absolute; bottom: 6px; right: 14px; font-size: 9pt; font-weight: 700; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="jonh-badge">JONH</div>
        <div class="header-text">
            <h1>Générateur d'étiquettes</h1>
            <p>Zoho Inventory — Sales Orders</p>
        </div>
    </div>

    <div class="search-box" id="searchBox">
        <h3>Rechercher des commandes</h3>
        <div class="search-row">
            <label>Une seule :</label>
            <input type="text" id="singleSO" placeholder="Ex: 165200" onkeydown="if(event.key==='Enter') chercherSeule()" />
            <button class="btn btn-green" onclick="chercherSeule()" id="btnSeule">Charger</button>
        </div>
        <div class="search-row">
            <label>Plage :</label>
            <input type="text" id="fromSO" placeholder="De (ex: 165200)" />
            <input type="text" id="toSO" placeholder="À (ex: 165210)" onkeydown="if(event.key==='Enter') chercherPlage()" />
            <button class="btn btn-blue" onclick="chercherPlage()" id="btnPlage">Charger lot</button>
        </div>
    </div>

    <div class="status" id="searchStatus" style="display:none;"></div>

    <div id="ordersContainer"></div>

    <div class="action-bar" id="globalActions" style="display:none; margin-top:20px;">
        <button class="btn btn-green" onclick="genererApercu()" style="flex:1;" id="btnApercu">👁️ Générer l'aperçu des étiquettes</button>
        <button class="btn btn-blue" onclick="toutSelectionner()">Tout sélect.</button>
        <button class="btn" style="background:#E5E9F2;color:#5A6C7D;" onclick="toutDeselectionner()">Effacer</button>
    </div>

    <div id="apercuContainer" style="display:none; margin-top:24px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid #6B8C3E;">
            <h2 style="font-size:18px; font-weight:700; color:#2C3E50;">Aperçu des étiquettes <span id="totalCount" style="color:#6B8C3E; font-weight:900;"></span></h2>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#E5E9F2;color:#5A6C7D;" onclick="fermerApercu()">↩ Retour</button>
                <button class="btn btn-green" onclick="imprimerMaintenant()" id="btnPrintNow">🖨️ Imprimer maintenant</button>
            </div>
        </div>
        <div id="apercuLabels"></div>
    </div>

    <div class="legend" id="legendBox" style="display:none;">
        <div><span class="tag tag-tiroir">TIROIR</span> Qté pré-remplie automatiquement (modifiable)</div>
        <div><span class="tag tag-simple">AUTRE</span> Qté à entrer manuellement par l'employé</div>
    </div>
</div>

<div class="print-area" id="printArea"></div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
var PROXY = 'https://zoho-proxy.conception.workers.dev';

// Le groupe "45" identifie les tiroirs dans Zoho Inventory
var GROUPE_TIROIR = '45';
// Le groupe "90" identifie les marqueurs/notes (=#CLIENT, AVISEZ, etc.)
var GROUPE_MARQUEUR = '90';

// ============================================================
// AUTO-CHARGEMENT depuis l'URL
// ============================================================
function getQueryParam(name) {
    var match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1]) : '';
}

window.addEventListener('load', function() {
    var soId = getQueryParam('so_id');
    var soNum = getQueryParam('so');
    var soFrom = getQueryParam('so_from');
    var soTo = getQueryParam('so_to');

    if (soId) {
        document.getElementById('searchBox').style.display = 'none';
        chargerParId(soId);
    } else if (soNum) {
        document.getElementById('singleSO').value = soNum;
        chercherSeule();
    } else if (soFrom && soTo) {
        document.getElementById('fromSO').value = soFrom;
        document.getElementById('toSO').value = soTo;
        chercherPlage();
    }
});

// ============================================================
// CHARGEMENT D'UNE COMMANDE PAR ID
// ============================================================
function chargerParId(soId) {
    showStatus('info', '<span class="spinner-dark"></span>Chargement de la commande...');

    return fetch(PROXY + '/inventory/salesorders/' + soId)
    .then(function(r) { return r.json(); })
    .then(function(detail) {
        if (!detail.salesorder) throw new Error('Commande introuvable');
        afficherCommandes([detail.salesorder]);
    })
    .catch(function(err) {
        showStatus('error', '❌ ' + (err.message || JSON.stringify(err)));
    });
}

// ============================================================
// RECHERCHE PAR NUMÉRO HUMAIN
// ============================================================
function chercherSeule() {
    var soNum = document.getElementById('singleSO').value.trim();
    if (!soNum) { showStatus('error', 'Entrez un numéro de commande.'); return; }

    var btn = document.getElementById('btnSeule');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Recherche...';
    showStatus('info', '⏳ Chargement...');
    document.getElementById('ordersContainer').innerHTML = '';
    document.getElementById('globalActions').style.display = 'none';
    document.getElementById('legendBox').style.display = 'none';

    fetch(PROXY + '/inventory/salesorders?salesorder_number=' + soNum)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var orders = data.salesorders;
        if (!orders || orders.length === 0) throw new Error('Commande introuvable : ' + soNum);
        return chargerParId(orders[0].salesorder_id);
    })
    .catch(function(err) {
        showStatus('error', '❌ ' + (err.message || JSON.stringify(err)));
    })
    .finally(function() {
        btn.disabled = false;
        btn.innerHTML = 'Charger';
    });
}

// ============================================================
// MODE LOT
// ============================================================
function chercherPlage() {
    var fromInput = document.getElementById('fromSO').value.trim();
    var toInput = document.getElementById('toSO').value.trim();
    if (!fromInput || !toInput) { showStatus('error', 'Entrez les deux numéros (de / à).'); return; }

    var from = parseInt(fromInput);
    var to = parseInt(toInput);
    if (isNaN(from) || isNaN(to)) { showStatus('error', 'Les numéros doivent être des nombres.'); return; }
    if (from > to) { var tmp = from; from = to; to = tmp; }
    if ((to - from) > 50) { showStatus('error', 'Plage trop grande (max 50 commandes).'); return; }

    var btn = document.getElementById('btnPlage');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Chargement...';
    document.getElementById('ordersContainer').innerHTML = '';
    document.getElementById('globalActions').style.display = 'none';
    document.getElementById('legendBox').style.display = 'none';

    var soNumbers = [];
    for (var i = from; i <= to; i++) soNumbers.push(i);

    showStatus('info', '⏳ Chargement de ' + soNumbers.length + ' commande(s)...');

    var promises = soNumbers.map(function(num) {
        return fetch(PROXY + '/inventory/salesorders?salesorder_number=' + num)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var orders = data.salesorders;
                if (!orders || orders.length === 0) return null;
                return fetch(PROXY + '/inventory/salesorders/' + orders[0].salesorder_id)
                    .then(function(r) { return r.json(); })
                    .then(function(detail) { return detail.salesorder || null; });
            })
            .catch(function() { return null; });
    });

    Promise.all(promises).then(function(results) {
        var validOrders = results.filter(function(o) { return o !== null; });
        if (validOrders.length === 0) {
            showStatus('error', '❌ Aucune commande trouvée dans la plage.');
        } else {
            afficherCommandes(validOrders);
        }
    })
    .finally(function() {
        btn.disabled = false;
        btn.innerHTML = 'Charger lot';
    });
}

// ============================================================
// DÉTECTION DU TYPE DE LIGNE
// ============================================================
function getGroupe(item) {
    // Récupère le cf_groupe depuis custom_field_hash ou item_custom_fields
    if (item.custom_field_hash && item.custom_field_hash.cf_groupe !== undefined) {
        return String(item.custom_field_hash.cf_groupe);
    }
    if (item.item_custom_fields) {
        for (var i = 0; i < item.item_custom_fields.length; i++) {
            var cf = item.item_custom_fields[i];
            if (cf.api_name === 'cf_groupe') {
                return String(cf.value);
            }
        }
    }
    return '';
}

function isMarqueur(item) {
    var desc = item.description || '';
    if (desc.indexOf('=#CLIENT') === 0) return true;
    if (desc.charCodeAt(0) === 8212) return true; // séparateur ————
    if (getGroupe(item) === GROUPE_MARQUEUR) return true;
    return false;
}

function isTiroir(item) {
    return getGroupe(item) === GROUPE_TIROIR;
}

// ============================================================
// AFFICHAGE
// ============================================================
function afficherCommandes(orders) {
    var container = document.getElementById('ordersContainer');
    container.innerHTML = '';

    var totalCommandes = 0;
    orders.forEach(function(so, orderIdx) {
        if (!so) return;
        totalCommandes++;
        container.appendChild(buildOrderCard(so, orderIdx));
    });

    if (totalCommandes > 0) {
        document.getElementById('globalActions').style.display = 'flex';
        document.getElementById('legendBox').style.display = 'flex';
        showStatus('success', '✅ ' + totalCommandes + ' commande(s) chargée(s).');
    }
}

function buildOrderCard(so, orderIdx) {
    var card = document.createElement('div');
    card.className = 'order-card';
    card.dataset.orderIdx = orderIdx;

    var nbItems = so.line_items.reduce(function(total, item) {
        if (isMarqueur(item)) return total;
        return total + (parseInt(item.quantity) || 0);
    }, 0);

    var header = '<div class="order-card-header">' +
        '<div><div class="order-num">Commande ' + so.salesorder_number + '</div>' +
        '<div class="order-meta">' + escapeHtml(so.customer_name) + (so.reference_number ? '  •  Réf: ' + escapeHtml(so.reference_number) : '') + '</div></div>' +
        '<div class="order-count">' + nbItems + ' item(s)</div></div>';

    var tableHtml = '<table class="items-table"><thead><tr>' +
        '<th style="width:36px; text-align:center;">✓</th>' +
        '<th style="width:80px;">Type</th>' +
        '<th>Item / Description</th>' +
        '<th style="width:55px;">Qté</th>' +
        '<th style="width:90px;">Qté étiq.</th>' +
        '</tr></thead><tbody>';

    so.line_items.forEach(function(item, lineIdx) {
        if (isMarqueur(item)) return;
        var desc = item.description || '';
        var qty = parseInt(item.quantity) || 1;
        var hasDessin = desc.toLowerCase().indexOf('dessin') >= 0;
        var tiroir = isTiroir(item);

        // Pour tiroir : valeur par défaut = qté ligne
        // Pour autre : vide (force la saisie)
        var qteEtiqValeur = tiroir ? qty : '';
        var qteEtiqClass = tiroir ? 'qte-tiroir' : 'qte-simple';
        var rowClass = tiroir ? 'tiroir-row' : 'simple-row';
        var typeTag = tiroir
            ? '<span class="tag tag-tiroir">Tiroir</span>'
            : '<span class="tag tag-simple">Autre</span>';
        var placeholder = tiroir ? '' : 'placeholder="?"';

        tableHtml += '<tr class="' + rowClass + '">' +
            '<td style="text-align:center;"><input type="checkbox" class="item-check" data-order="' + orderIdx + '" data-line="' + lineIdx + '" checked></td>' +
            '<td>' + typeTag + '</td>' +
            '<td><div class="item-name">' + escapeHtml(desc) + '</div>' + (hasDessin ? '<div class="item-dessin">📐 VOIR DESSIN</div>' : '') + '</td>' +
            '<td style="font-weight:700;">' + qty + '</td>' +
            '<td><input type="number" class="qte-input ' + qteEtiqClass + '" data-order="' + orderIdx + '" data-line="' + lineIdx + '" value="' + qteEtiqValeur + '" min="0" max="999" ' + placeholder + '></td>' +
            '</tr>';
    });

    tableHtml += '</tbody></table>';
    card.innerHTML = header + tableHtml;
    card._so = so;
    return card;
}

function toutSelectionner()   { document.querySelectorAll('.item-check').forEach(function(cb) { cb.checked = true; }); }
function toutDeselectionner() { document.querySelectorAll('.item-check').forEach(function(cb) { cb.checked = false; }); }

// ============================================================
// PARSING (logique V5)
// ============================================================
function parseDescription(desc) {
    var idx = desc.lastIndexOf(' -');
    var itemName, options;
    if (idx > 0) {
        itemName = desc.substring(0, idx).trim();
        options  = desc.substring(idx + 2).trim();
    } else {
        itemName = desc;
        options  = '';
    }
    itemName = itemName.replace(/^\d+[A-Z]+\d+\s*-\s*/, '');
    return { itemName: itemName, options: options };
}

function parseClientMarker(desc) {
    var code = desc.substring(9).trim();
    if (/^[A-Za-z]{2}-/.test(code)) {
        var parts = code.split('-');
        if (parts.length >= 3) {
            return {
                refClient: parts.slice(0, 2).join('-'),
                sousPO:    parts.slice(2).join('-')
            };
        }
    }
    return { refClient: code, sousPO: '' };
}

function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============================================================
// GÉNÉRATION DES ÉTIQUETTES + IMPRESSION
// ============================================================
function buildLabelsForOrder(so, orderIdx) {
    var totalItems = so.line_items.reduce(function(total, item) {
        if (isMarqueur(item)) return total;
        return total + (parseInt(item.quantity) || 0);
    }, 0);

    var contextByLine = {};
    var refClientCourant = '', sousPOCourant = '';
    so.line_items.forEach(function(item, i) {
        var d = item.description || '';
        if (d.indexOf('=#CLIENT=') === 0) {
            var parsed = parseClientMarker(d);
            refClientCourant = parsed.refClient;
            sousPOCourant    = parsed.sousPO;
            return;
        }
        if (isMarqueur(item)) return;
        contextByLine[i] = { refClient: refClientCourant, sousPO: sousPOCourant };
    });

    var labelsHtml = '', labelCount = 0;

    so.line_items.forEach(function(item, lineIdx) {
        if (isMarqueur(item)) return;

        var checkbox = document.querySelector('.item-check[data-order="' + orderIdx + '"][data-line="' + lineIdx + '"]');
        if (!checkbox || !checkbox.checked) return;

        var qteInput = document.querySelector('.qte-input[data-order="' + orderIdx + '"][data-line="' + lineIdx + '"]');
        var nbEtiq = parseInt(qteInput.value) || 0;
        if (nbEtiq <= 0) return;

        var desc = item.description || '';
        var ctx = contextByLine[lineIdx] || { refClient: '', sousPO: '' };
        var parsed = parseDescription(desc);
        var optLower = parsed.options.toLowerCase();
        var vernis = optLower.indexOf('vernis') >= 0 ? 'Oui' : 'Non';
        var logo   = optLower.indexOf('logo')   >= 0 ? 'Oui' : 'Non';
        var clips  = optLower.indexOf('clip')   >= 0 ? 'Oui' : 'Non';

        for (var n = 0; n < nbEtiq; n++) {
            labelCount++;
            labelsHtml +=
                '<div class="apercu-label">' +
                '<div class="label-body">' +
                '<div class="row row-top"><span class="k">Commande :</span><span class="v vbig">' + so.salesorder_number + '</span><span class="k ml">Total items/commande :</span><span class="v vbig">' + totalItems + '</span></div>' +
                '<div class="row"><span class="k">Client :</span><span class="v">' + escapeHtml(so.customer_name) + '</span></div>' +
                '<div class="row"><span class="k">R\u00e9f. client :</span><span class="v">' + escapeHtml(ctx.refClient) + '</span></div>' +
                '<div class="row"><span class="k">Sous-PO :</span><span class="v">' + escapeHtml(ctx.sousPO) + '</span></div>' +
                '<div class="row row-item"><span class="k">Item :</span><span class="v item-v">' + escapeHtml(parsed.itemName) + '</span></div>' +
                (parsed.options ? '<div class="row"><span class="k">Options :</span><span class="v item-v">' + escapeHtml(parsed.options) + '</span></div>' : '') +
                '</div>' +
                '<div class="label-footer">' +
                '<div class="flags"><span><b>Logo :</b> ' + logo + '</span><span><b>Clips :</b> ' + clips + '</span><span><b>Vernis :</b> ' + vernis + '</span></div>' +
                '<div class="made">Fabriqu\u00e9 au Canada / Made in Canada</div>' +
                '<div class="nbitem">Nb item: ' + nbEtiq + '</div>' +
                '</div></div>';
        }
    });

    return { html: labelsHtml, count: labelCount };
}

function imprimerMaintenant() {
    var btn = document.getElementById('btnPrintNow');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Impression...';

    // Copier l'aperçu vers la zone d'impression (avec classes "label" pour @media print)
    var apercuHtml = document.getElementById('apercuLabels').innerHTML;
    // Remplacer la classe "apercu-label" par "label" pour que le CSS @media print s'applique
    var printHtml = apercuHtml.replace(/class="apercu-label"/g, 'class="label"');
    // Enlever les numéros d'aperçu (ne doivent pas s'imprimer)
    printHtml = printHtml.replace(/<div class="apercu-num">[^<]*<\/div>/g, '');

    document.getElementById('printArea').innerHTML = printHtml;

    // Délai pour laisser le navigateur faire le rendu propre (évite les lignes noires)
    setTimeout(function() {
        window.print();
        setTimeout(function() {
            btn.disabled = false;
            btn.innerHTML = '🖨️ Imprimer maintenant';
        }, 500);
    }, 300);
}

function fermerApercu() {
    document.getElementById('apercuContainer').style.display = 'none';
    document.getElementById('apercuLabels').innerHTML = '';
    // Scroll en haut pour revoir la liste
    document.getElementById('ordersContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function genererApercu() {
    var allLabelsHtml = '';
    var totalLabels = 0;
    var labelNum = 0;

    document.querySelectorAll('.order-card').forEach(function(card) {
        var orderIdx = parseInt(card.dataset.orderIdx);
        var so = card._so;
        if (!so) return;
        var built = buildLabelsForOrder(so, orderIdx);
        // Ajouter un numéro d'étiquette au-dessus de chaque étiquette de l'aperçu
        var numbered = '';
        // Découper en étiquettes individuelles pour numéroter
        var labelMatches = built.html.match(/<div class="apercu-label">[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/g) || [];
        labelMatches.forEach(function(labelHtml) {
            labelNum++;
            numbered += '<div class="apercu-num">Étiquette #' + labelNum + ' / ' + 'CMD ' + so.salesorder_number + '</div>' + labelHtml;
        });
        allLabelsHtml += numbered;
        totalLabels += built.count;
    });

    if (totalLabels === 0) {
        alert('Aucune étiquette à imprimer.\n\nVérifiez que :\n- Au moins une ligne est cochée\n- Les lignes "Autre" ont une qté étiquettes saisie');
        return;
    }

    document.getElementById('apercuLabels').innerHTML = allLabelsHtml;
    document.getElementById('totalCount').textContent = '(' + totalLabels + ' étiquette' + (totalLabels > 1 ? 's' : '') + ')';
    document.getElementById('apercuContainer').style.display = 'block';

    // Scroll vers l'aperçu
    setTimeout(function() {
        document.getElementById('apercuContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function showStatus(type, msg) {
    var el = document.getElementById('searchStatus');
    el.className = 'status ' + type;
    el.innerHTML = msg;
    el.style.display = 'block';
}
</script>
