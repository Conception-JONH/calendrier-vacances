<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étiquettes JONH — Zoho Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Lato', Arial, sans-serif; background: #F5F7FA; padding: 40px 20px; min-height: 100vh; }
.container { max-width: 700px; margin: 0 auto; background: white; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); padding: 36px; }
.header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid #6B8C3E; }
.jonh-badge { background: #6B8C3E; color: white; font-weight: 900; font-size: 22px; letter-spacing: 2px; padding: 8px 16px; border-radius: 5px; line-height: 1; }
.header-text h1 { font-size: 20px; font-weight: 700; color: #2C3E50; }
.header-text p  { font-size: 13px; color: #95A5A6; margin-top: 2px; }
.search-row { display: flex; gap: 10px; margin-bottom: 6px; }
.search-row input { flex: 1; padding: 12px 16px; border: 1px solid #D1D9E6; border-radius: 4px; font-size: 15px; font-family: 'Lato', sans-serif; color: #2C3E50; transition: border-color 0.2s; }
.search-row input:focus { outline: none; border-color: #6B8C3E; box-shadow: 0 0 0 3px rgba(107,140,62,0.12); }
.btn { padding: 12px 20px; font-size: 14px; font-weight: 700; font-family: 'Lato', sans-serif; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.btn-green { background: #6B8C3E; color: white; }
.btn-green:hover { background: #587530; }
.btn-green:disabled { background: #B0C48A; cursor: not-allowed; }
.btn-blue { background: #4A90E2; color: white; }
.btn-blue:hover { background: #357ABD; }
.btn-sm { padding: 9px 16px; font-size: 13px; }
.status { padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-top: 10px; display: none; }
.status.success { background: #DFF0D8; color: #3C763D; border: 1px solid #D6E9C6; display: block; }
.status.error   { background: #FDECEA; color: #B94A48; border: 1px solid #F5C6CB; display: block; }
.status.info    { background: #D9EDF7; color: #31708F; border: 1px solid #BCE8F1; display: block; }
.order-card { margin-top: 24px; border: 1px solid #E5E9F2; border-radius: 6px; overflow: hidden; display: none; }
.order-card-header { background: #6B8C3E; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.order-num { font-size: 18px; font-weight: 900; }
.order-meta { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.order-count { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
.items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.items-table th { padding: 9px 12px; background: #F0F3F0; color: #5A6C7D; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; }
.items-table td { padding: 11px 12px; border-bottom: 1px solid #F0F3F0; color: #2C3E50; vertical-align: top; }
.items-table tr:last-child td { border-bottom: none; }
.items-table tr:hover td { background: #FAFCFA; }
.item-name { font-weight: 600; font-size: 12px; }
.item-dessin { font-size: 11px; color: #6B8C3E; font-weight: 700; margin-top: 2px; }
input[type="checkbox"] { width: 15px; height: 15px; accent-color: #6B8C3E; cursor: pointer; }
.action-bar { padding: 14px 18px; background: #F8F9FC; border-top: 1px solid #E5E9F2; display: flex; gap: 10px; align-items: center; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print { body { display: none; } }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="jonh-badge">JONH</div>
        <div class="header-text">
            <h1>Générateur d'étiquettes</h1>
            <p>Zoho Inventory — Sales Orders</p>
        </div>
    </div>
    <div class="search-row">
        <input type="text" id="soNumber" placeholder="Numéro de commande (ex: 165117)" onkeydown="if(event.key==='Enter') rechercher()" />
        <button class="btn btn-green" onclick="rechercher()" id="btnSearch">🔍 Rechercher</button>
    </div>
    <div class="status" id="searchStatus"></div>
    <div class="order-card" id="orderCard">
        <div class="order-card-header">
            <div>
                <div class="order-num" id="cardNum"></div>
                <div class="order-meta" id="cardMeta"></div>
            </div>
            <div class="order-count" id="cardCount"></div>
        </div>
        <table class="items-table">
            <thead>
                <tr>
                    <th style="width:36px; text-align:center;">✓</th>
                    <th>Item / Description</th>
                    <th style="width:55px;">Qté</th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
        <div class="action-bar">
            <button class="btn btn-green" onclick="genererEtiquettes()" style="flex:1;">🖨️ Générer les étiquettes</button>
            <button class="btn btn-blue btn-sm" onclick="toutSelectionner()">Tout sélect.</button>
            <button class="btn btn-sm" style="background:#E5E9F2;color:#5A6C7D;" onclick="toutDeselectionner()">Effacer</button>
        </div>
    </div>
</div>

<script>
var currentOrder = null;
var PROXY = 'https://zoho-proxy.conception.workers.dev';

function rechercher() {
    var soNum = document.getElementById('soNumber').value.trim();
    if (!soNum) { showStatus('searchStatus', 'error', 'Entrez un numéro de commande.'); return; }

    var btn = document.getElementById('btnSearch');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Recherche...';
    showStatus('searchStatus', 'info', '⏳ Chargement...');
    document.getElementById('orderCard').style.display = 'none';

    // Étape 1 : chercher par numéro
    fetch(PROXY + '/inventory/salesorders?salesorder_number=' + soNum)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var orders = data.salesorders;
        if (!orders || orders.length === 0) throw new Error('Commande introuvable : ' + soNum);
        var soId = orders[0].salesorder_id;
        // Étape 2 : charger le détail
        return fetch(PROXY + '/inventory/salesorders/' + soId);
    })
    .then(function(r) { return r.json(); })
    .then(function(detail) {
        var so = detail.salesorder;
        if (!so) throw new Error('Détail introuvable');
        currentOrder = so;
        afficherCommande(so);
        var nbItems = so.line_items.filter(function(item) {
            var d = item.description || '';
            return d.indexOf('=#CLIENT') !== 0 && d.charCodeAt(0) !== 8212;
        }).length;
        showStatus('searchStatus', 'success', '✅ Commande ' + so.salesorder_number + ' — ' + nbItems + ' item(s) chargé(s).');
    })
    .catch(function(err) {
        showStatus('searchStatus', 'error', '❌ ' + (err.message || JSON.stringify(err)));
    })
    .finally(function() {
        btn.disabled = false;
        btn.innerHTML = '🔍 Rechercher';
    });
}

function afficherCommande(so) {
    document.getElementById('cardNum').textContent  = 'Commande : ' + so.salesorder_number;
    document.getElementById('cardMeta').textContent = so.customer_name + (so.reference_number ? '  •  Réf: ' + so.reference_number : '');

    var nbItems = so.line_items.filter(function(item) {
        var d = item.description || '';
        return d.indexOf('=#CLIENT') !== 0 && d.charCodeAt(0) !== 8212;
    }).length;
    document.getElementById('cardCount').textContent = nbItems + ' item(s)';

    var tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';

    so.line_items.forEach(function(item, i) {
        var desc = item.description || '';
        if (desc.indexOf('=#CLIENT') === 0 || desc.charCodeAt(0) === 8212) return;
        var hasDessin = desc.toLowerCase().indexOf('dessin') >= 0;
        var tr = document.createElement('tr');
        tr.innerHTML =
            '<td style="text-align:center;"><input type="checkbox" class="item-check" data-idx="' + i + '" checked></td>' +
            '<td><div class="item-name">' + desc + '</div>' + (hasDessin ? '<div class="item-dessin">📐 VOIR DESSIN</div>' : '') + '</td>' +
            '<td style="font-weight:700;">' + item.quantity + '</td>';
        tbody.appendChild(tr);
    });

    document.getElementById('orderCard').style.display = 'block';
}

function toutSelectionner()   { document.querySelectorAll('.item-check').forEach(function(cb) { cb.checked = true; }); }
function toutDeselectionner() { document.querySelectorAll('.item-check').forEach(function(cb) { cb.checked = false; }); }

function genererEtiquettes() {
    if (!currentOrder) return;
    var so = currentOrder;
    var selected = [];
    document.querySelectorAll('.item-check:checked').forEach(function(cb) { selected.push(parseInt(cb.dataset.idx)); });
    if (selected.length === 0) { alert('Sélectionnez au moins un item.'); return; }

    var items = selected.map(function(i) { return so.line_items[i]; });
    var totalItems = so.line_items.filter(function(item) {
        var d = item.description || '';
        return d.indexOf('=#CLIENT') !== 0 && d.charCodeAt(0) !== 8212;
    }).length;

    var labelsHtml = '';
    items.forEach(function(item) {
        var desc     = item.description || '';
        var vernis   = desc.toLowerCase().indexOf('vernis') >= 0 ? 'Oui' : 'Non';
        var logo     = desc.toLowerCase().indexOf('logo') >= 0 ? 'Oui' : 'Non';
        var clips    = desc.toLowerCase().indexOf('clip') >= 0 ? 'Oui' : 'Non';
        var hasDessin = desc.toLowerCase().indexOf('dessin') >= 0;
        var parts    = desc.split(' - ');
        var itemName = parts.length >= 3 ? parts.slice(1).join(' - ') : desc;
        var options  = hasDessin ? 'VOIR DESSIN' : '';

        labelsHtml +=
            '<div class="label"><div class="label-top"></div>' +
            '<div class="label-logo-row"><div class="jonh-badge">JONH</div><sup class="reg">®</sup></div>' +
            '<div class="label-body">' +
            '<div class="row"><span class="k">Commande :</span><span class="v">' + so.salesorder_number + '</span><span class="k ml">Total items/commande :</span><span class="v">' + totalItems + '</span></div>' +
            '<div class="row"><span class="k">Client :</span><span class="v">' + so.customer_name + '</span></div>' +
            '<div class="row"><span class="k">Réf. client :</span><span class="v">' + (so.reference_number || '') + '</span></div>' +
            '<div class="row"><span class="k">Sous-PO :</span><span class="v">' + (so.notes || '') + '</span></div>' +
            '<div class="row"><span class="k">Item :</span><span class="v item-v">' + itemName + '</span></div>' +
            (options ? '<div class="row"><span class="k">Options :</span><span class="v">' + options + '</span></div>' : '') +
            '</div>' +
            '<div class="label-footer">' +
            '<div class="flags"><span><b>Logo :</b> ' + logo + '</span><span><b>Clips :</b> ' + clips + '</span><span><b>Vernis :</b> ' + vernis + '</span></div>' +
            '<div class="made">Fabriqué au Canada / Made in Canada</div>' +
            '<div class="nbitem">Nb item: 1</div>' +
            '</div></div>';
    });

    var win = window.open('', '_blank');
    win.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Etiquettes ' + so.salesorder_number + '</title><style>@page{size:4in 2.875in;margin:0}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:white}.label{width:4in;height:2.875in;page-break-after:always;display:flex;flex-direction:column;position:relative;border:1px solid #ccc;overflow:hidden}.label-top{height:6px;background:#6B8C3E;flex-shrink:0}.label-logo-row{display:flex;align-items:center;padding:7px 12px 3px;flex-shrink:0}.jonh-badge{background:#6B8C3E;color:white;font-weight:900;font-size:19pt;letter-spacing:2px;padding:3px 12px;border-radius:5px;line-height:1}.reg{font-size:8pt;color:#6B8C3E;margin-left:2px;align-self:flex-start;margin-top:2px}.label-body{flex:1;padding:2px 12px 0;overflow:hidden}.row{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px;margin-bottom:2px}.k{font-weight:700;font-size:7.5pt;white-space:nowrap;flex-shrink:0}.v{font-size:7.5pt;word-break:break-word}.item-v{font-weight:600;font-size:7pt}.ml{margin-left:auto}.label-footer{padding:3px 12px 5px;border-top:1px solid #ddd;flex-shrink:0;position:relative}.flags{display:flex;gap:12px;font-size:7.5pt;margin-bottom:1px}.flags b{font-weight:700}.made{font-size:6.5pt;color:#555;font-style:italic}.nbitem{position:absolute;bottom:5px;right:12px;font-size:7.5pt;font-weight:700}@media print{.label{border:none}}</style></head><body>' + labelsHtml + '<scr' + 'ipt>window.onload=function(){window.print()};<\/scr' + 'ipt></body></html>');
    win.document.close();
}

function showStatus(id, type, msg) {
    var el = document.getElementById(id);
    el.className = 'status ' + type;
    el.innerHTML = msg;
}
</script>
</body>
</html>
