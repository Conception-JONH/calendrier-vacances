<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étiquettes JONH — Zoho Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #F5F4E8;
    --surface: #FFFFFF;
    --surface-alt: #FAFAF2;
    --border: #E0DFD0;
    --border-strong: #C9C7B4;
    --text: #2C3318;
    --text-muted: #5F6B47;
    --text-faint: #9AA585;

    --primary: #5D6F2E;
    --primary-hover: #4A5926;
    --primary-soft: #EDEFD9;
    --primary-dark: #3E4A1E;

    --accent: #8B5A2B;
    --accent-hover: #714720;
    --accent-soft: #F4EAD9;

    --success: #5D6F2E;
    --error: #A04545;
    --info: #4A6B8A;

    --shadow-sm: 0 1px 2px rgba(46, 56, 24, 0.06);
    --shadow-md: 0 1px 3px rgba(46, 56, 24, 0.08), 0 4px 12px rgba(46, 56, 24, 0.04);
    --radius-sm: 5px;
    --radius-md: 8px;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

.container {
    max-width: 920px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    overflow: hidden;
}

.header {
    padding: 26px 32px;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff;
    border-bottom: 1px solid var(--border);
}
.header-title {
    font-size: 19px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
}
.header-subtitle {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.78);
    margin-top: 3px;
    font-weight: 400;
}

.section {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
}
.section:last-of-type { border-bottom: none; }

.section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
}

.search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    align-items: center;
    flex-wrap: wrap;
}
.search-row:last-child { margin-bottom: 0; }
.search-row label {
    font-weight: 500;
    font-size: 13px;
    color: var(--text);
    min-width: 110px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    min-width: 110px;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(93, 111, 46, 0.15);
}
.input::placeholder { color: var(--text-faint); }

.btn {
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    line-height: 1.4;
    background: var(--surface);
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-primary {
    background: var(--surface);
    color: var(--primary);
    border-color: var(--primary);
}
.btn-primary:hover:not(:disabled) {
    background: var(--primary-soft);
    color: var(--primary-hover);
    border-color: var(--primary-hover);
}

.btn-solid {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.btn-solid:hover:not(:disabled) {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
}

.btn-accent {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--accent);
}
.btn-accent:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent-hover);
    border-color: var(--accent-hover);
}

.btn-ghost {
    background: var(--surface);
    color: var(--text-muted);
    border-color: var(--border-strong);
}
.btn-ghost:hover:not(:disabled) {
    background: var(--surface-alt);
    color: var(--text);
    border-color: var(--text-muted);
}

.status {
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin: 0 32px 20px;
    border: 1px solid;
    display: flex;
    align-items: center;
    gap: 8px;
}
.status.success { background: var(--primary-soft); color: var(--primary-hover); border-color: rgba(93,111,46,0.25); }
.status.error   { background: #F8E8E8; color: var(--error); border-color: #E0C0C0; }
.status.info    { background: #E8EFF5; color: var(--info);  border-color: #C5D5E2; }

#ordersContainer { padding: 0 32px; background: var(--surface); }
#ordersContainer:not(:empty) { padding-top: 12px; padding-bottom: 12px; }

.order-card {
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--surface);
}

.order-card-header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.order-num { font-size: 14px; font-weight: 600; }
.order-meta { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; font-weight: 400; }
.order-count {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    padding: 4px 11px;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
}

.items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.items-table th {
    padding: 10px 14px;
    background: var(--surface-alt);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: left;
    border-bottom: 1px solid var(--border);
}
.items-table td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
}
.items-table tr:last-child td { border-bottom: none; }
.items-table tr.tiroir-row td { background: rgba(93, 111, 46, 0.025); }
.items-table tr.tiroir-row:hover td { background: rgba(93, 111, 46, 0.07); }
.items-table tr.simple-row td { background: rgba(139, 90, 43, 0.025); }
.items-table tr.simple-row:hover td { background: rgba(139, 90, 43, 0.07); }

.item-name { font-weight: 500; font-size: 13px; line-height: 1.45; }
.item-dessin {
    display: inline-block;
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 4px;
    padding: 2px 7px;
    background: var(--accent-soft);
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.tag {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1.4;
    border: 1px solid transparent;
}
.tag-tiroir { background: var(--primary-soft); color: var(--primary); border-color: rgba(93,111,46,0.25); }
.tag-simple { background: var(--accent-soft);  color: var(--accent);  border-color: rgba(139,90,43,0.28); }

input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

.qte-input {
    width: 64px;
    padding: 6px 8px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    text-align: center;
    font-family: inherit;
    font-weight: 500;
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
}
.qte-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(93, 111, 46, 0.18);
}
.qte-input.qte-simple { border-color: var(--accent); }
.qte-input.qte-simple:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,90,43,0.2); }
.qte-input.qte-simple::placeholder { color: var(--accent); opacity: 0.55; font-weight: 600; }

.action-bar {
    padding: 16px 32px;
    background: var(--surface-alt);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    bottom: 0;
    z-index: 10;
}
.action-bar .btn-solid { flex: 1; min-width: 200px; }

.legend {
    padding: 14px 22px;
    background: var(--surface-alt);
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: center;
}
.legend > div { display: flex; align-items: center; gap: 8px; }

.spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 7px;
    vertical-align: -2px;
}
.spinner-dark {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(93,111,46,0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 7px;
    vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.apercu-section {
    padding: 24px 32px;
    border-top: 1px solid var(--border);
    background: var(--surface-alt);
}
.apercu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
}
.apercu-header h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
}
.apercu-header h2 .total-count {
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 6px;
}
.apercu-actions { display: flex; gap: 8px; }

.apercu-num {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.02em;
}

/* ============================================================
   APERÇU À L'ÉCRAN (avant impression)
   ============================================================ */
.apercu-label {
    width: 4in;
    height: 2.875in;
    border: 1px dashed var(--border-strong);
    background: white;
    margin: 0 auto 18px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    padding-top: 0.75in;
    font-family: Arial, sans-serif;
    box-shadow: var(--shadow-sm);
    border-radius: 3px;
}
.apercu-label .label-body { flex: 1; padding: 4px 14px 0; overflow: hidden; }
.apercu-label .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }
.apercu-label .row-item { flex-wrap: nowrap; align-items: flex-start; }
.apercu-label .row-item .item-v { white-space: normal; word-break: break-word; flex: 1; min-width: 0; }
.apercu-label .row-top { margin-bottom: 4px; }
.apercu-label .k { font-weight: 700; font-size: 10pt; white-space: nowrap; flex-shrink: 0; color: #000; }
.apercu-label .v { font-size: 10pt; word-break: break-word; color: #000; }
.apercu-label .vbig { font-weight: 400; font-size: 11pt; }
.apercu-label .item-v { font-weight: 400; font-size: 9pt; line-height: 1.2; }
.apercu-label .ml { margin-left: auto; }
.apercu-label .label-footer { padding: 4px 14px 6px; border-top: 0.5pt solid #999; flex-shrink: 0; position: relative; }
.apercu-label .flags { display: flex; gap: 14px; font-size: 9pt; margin-bottom: 2px; color: #000; }
.apercu-label .flags b { font-weight: 700; }
.apercu-label .made { font-size: 8pt; color: #555; font-style: italic; }
.apercu-label .nbitem { position: absolute; bottom: 6px; right: 14px; font-size: 9pt; font-weight: 700; color: #000; }

/* ============================================================
   IMPRESSION (4" x 2.875" Zebra)
   ============================================================ */
.print-area { display: none; }

@media print {
    body > *:not(.print-area) { display: none !important; }
    body { padding: 0; margin: 0; background: white; }
    .print-area { display: block !important; }
    .container { display: none !important; }

    @page { size: 4in 2.875in; margin: 0; }
    html, body { width: 4in; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .label {
        width: 4in; height: 2.875in;
        page-break-after: always; page-break-inside: avoid; break-inside: avoid;
        display: flex; flex-direction: column;
        position: relative; overflow: hidden;
        padding-top: 0.75in; font-family: Arial, sans-serif;
    }
    .label:last-child { page-break-after: auto; }
    .label-body { flex: 1; padding: 4px 14px 0; overflow: hidden; }
    .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }
    .row-item { flex-wrap: nowrap; align-items: flex-start; }
    .row-item .item-v { white-space: normal; word-break: break-word; flex: 1; min-width: 0; }
    .row-top { margin-bottom: 4px; }
    .k { font-weight: 700; font-size: 10pt; white-space: nowrap; flex-shrink: 0; }
    .v { font-size: 10pt; word-break: break-word; }
    .vbig { font-weight: 400; font-size: 11pt; }
    .item-v { font-weight: 400; font-size: 9pt; line-height: 1.2; }
    .ml { margin-left: auto; }
    .label-footer { padding: 4px 14px 6px; border-top: 0.5pt solid #999; flex-shrink: 0; position: relative; }
    .flags { display: flex; gap: 14px; font-size: 9pt; margin-bottom: 2px; }
    .flags b { font-weight: 700; }
    .made { font-size: 8pt; color: #555; font-style: italic; }
    .nbitem { position: absolute; bottom: 6px; right: 14px; font-size: 9pt; font-weight: 700; }
}
</style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="header-title">Générateur d'étiquettes</div>
        <div class="header-subtitle">Production Tiroirs JONH — Zoho Inventory</div>
    </div>

    <div class="section" id="searchBox">
        <div class="section-title">Rechercher des commandes</div>

        <div class="search-row">
            <label>Une seule</label>
            <input type="text" class="input" id="singleSO" placeholder="Numéro de commande (ex. 165200)" onkeydown="if(event.key==='Enter') chercherSeule()" />
            <button class="btn btn-primary" onclick="chercherSeule()" id="btnSeule">Charger</button>
        </div>

        <div class="search-row">
            <label>Plage <span class="tag tag-tiroir">Tiroirs</span></label>
            <input type="text" class="input" id="fromSOTiroir" placeholder="De (ex. 165200)" />
            <input type="text" class="input" id="toSOTiroir" placeholder="À (ex. 165210)" onkeydown="if(event.key==='Enter') chercherPlage('tiroir')" />
            <button class="btn btn-primary" onclick="chercherPlage('tiroir')" id="btnPlageTiroir">Charger lot tiroirs</button>
        </div>

        <div class="search-row">
            <label>Plage <span class="tag tag-simple">Autres</span></label>
            <input type="text" class="input" id="fromSOAutre" placeholder="De (ex. 165200)" />
            <input type="text" class="input" id="toSOAutre" placeholder="À (ex. 165210)" onkeydown="if(event.key==='Enter') chercherPlage('autre')" />
            <button class="btn btn-accent" onclick="chercherPlage('autre')" id="btnPlageAutre">Charger lot autres</button>
        </div>
    </div>

    <div class="status" id="searchStatus" style="display:none;"></div>

    <div id="ordersContainer"></div>

    <div class="action-bar" id="globalActions" style="display:none;">
        <button class="btn btn-solid" onclick="genererApercu()" id="btnApercu">Générer l'aperçu des étiquettes</button>
        <button class="btn btn-primary" onclick="toutSelectionner()">Tout sélectionner</button>
        <button class="btn btn-ghost" onclick="toutDeselectionner()">Tout désélectionner</button>
    </div>

    <div class="legend" id="legendBox" style="display:none;">
        <div><span class="tag tag-tiroir">Tiroir</span> Quantité pré-remplie automatiquement (modifiable)</div>
        <div><span class="tag tag-simple">Autre</span> Quantité à entrer manuellement par l'employé</div>
    </div>

    <div class="apercu-section" id="apercuContainer" style="display:none;">
        <div class="apercu-header">
            <h2>Aperçu des étiquettes <span class="total-count" id="totalCount"></span></h2>
            <div class="apercu-actions">
                <button class="btn btn-ghost" onclick="fermerApercu()">Retour</button>
                <button class="btn btn-solid" onclick="imprimerMaintenant()" id="btnPrintNow">Imprimer maintenant</button>
            </div>
        </div>
        <div id="apercuLabels"></div>
    </div>

</div>

<div class="print-area" id="printArea"></div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
var PROXY = 'https://zoho-proxy.conception.workers.dev';
var GROUPE_TIROIR = '45';
var GROUPE_MARQUEUR = '90';

// ============================================================
// DÉTECTION DES OPTIONS (LOGO / CLIPS / VERNIS)
// Cherche dans toute la description, avec word-boundary,
// insensible à la casse.
// ============================================================
function hasOption(desc, motCle) {
    if (!desc) return false;
    var re = new RegExp('\\b' + motCle + '\\b', 'i');
    return re.test(desc);
}

// ============================================================
// AUTO-CHARGEMENT depuis l'URL
// ============================================================
function getQueryParam(name) {
    var match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1]) : '';
}

window.addEventListener('load', function() {
    var soId = getQueryParam('so_id');
    var soNum = getQueryParam('so');
    var soFrom = getQueryParam('so_from');
    var soTo = getQueryParam('so_to');
    var typeParam = getQueryParam('type');

    if (soId) {
        document.getElementById('searchBox').style.display = 'none';
        chargerParId(soId);
    } else if (soNum) {
        document.getElementById('singleSO').value = soNum;
        chercherSeule();
    } else if (soFrom && soTo) {
        var typeFilter = (typeParam === 'autre') ? 'autre' : 'tiroir';
        var prefix = typeFilter === 'tiroir' ? 'Tiroir' : 'Autre';
        document.getElementById('fromSO' + prefix).value = soFrom;
        document.getElementById('toSO' + prefix).value = soTo;
        chercherPlage(typeFilter);
    }
});

function chargerParId(soId) {
    window._currentTypeFilter = null;
    showStatus('info', '<span class="spinner-dark"></span>Chargement de la commande...');
    return fetch(PROXY + '/inventory/salesorders/' + soId)
    .then(function(r) { return r.json(); })
    .then(function(detail) {
        if (!detail.salesorder) throw new Error('Commande introuvable');
        afficherCommandes([detail.salesorder]);
    })
    .catch(function(err) { showStatus('error', (err.message || JSON.stringify(err))); });
}

function chercherSeule() {
    window._currentTypeFilter = null;
    var soNum = document.getElementById('singleSO').value.trim();
    if (!soNum) { showStatus('error', 'Entrez un numéro de commande.'); return; }

    var btn = document.getElementById('btnSeule');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-dark"></span>Recherche...';
    showStatus('info', '<span class="spinner-dark"></span>Chargement...');
    document.getElementById('ordersContainer').innerHTML = '';
    document.getElementById('globalActions').style.display = 'none';
    document.getElementById('legendBox').style.display = 'none';

    fetch(PROXY + '/inventory/salesorders?salesorder_number=' + soNum)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var orders = data.salesorders;
        if (!orders || orders.length === 0) throw new Error('Commande introuvable : ' + soNum);
        return chargerParId(orders[0].salesorder_id);
    })
    .catch(function(err) { showStatus('error', (err.message || JSON.stringify(err))); })
    .finally(function() { btn.disabled = false; btn.innerHTML = 'Charger'; });
}

function chercherPlage(typeFilter) {
    var prefix = typeFilter === 'tiroir' ? 'Tiroir' : 'Autre';
    var fromInput = document.getElementById('fromSO' + prefix).value.trim();
    var toInput = document.getElementById('toSO' + prefix).value.trim();
    if (!fromInput || !toInput) { showStatus('error', 'Entrez les deux numéros (de / à).'); return; }

    var from = parseInt(fromInput);
    var to = parseInt(toInput);
    if (isNaN(from) || isNaN(to)) { showStatus('error', 'Les numéros doivent être des nombres.'); return; }
    if (from > to) { var tmp = from; from = to; to = tmp; }
    if ((to - from) > 50) { showStatus('error', 'Plage trop grande (maximum 50 commandes).'); return; }

    var btnId = typeFilter === 'tiroir' ? 'btnPlageTiroir' : 'btnPlageAutre';
    var btnLabel = typeFilter === 'tiroir' ? 'Charger lot tiroirs' : 'Charger lot autres';
    var btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-dark"></span>Chargement...';
    document.getElementById('ordersContainer').innerHTML = '';
    document.getElementById('globalActions').style.display = 'none';
    document.getElementById('legendBox').style.display = 'none';

    var soNumbers = [];
    for (var i = from; i <= to; i++) soNumbers.push(i);

    showStatus('info', '<span class="spinner-dark"></span>Chargement de ' + soNumbers.length + ' commande(s)...');

    var promises = soNumbers.map(function(num) {
        return fetch(PROXY + '/inventory/salesorders?salesorder_number=' + num)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var orders = data.salesorders;
                if (!orders || orders.length === 0) return null;
                return fetch(PROXY + '/inventory/salesorders/' + orders[0].salesorder_id)
                    .then(function(r) { return r.json(); })
                    .then(function(detail) { return detail.salesorder || null; });
            })
            .catch(function() { return null; });
    });

    Promise.all(promises).then(function(results) {
        var validOrders = results.filter(function(o) { return o !== null; });
        var filteredOrders = validOrders.filter(function(so) {
            return so.line_items.some(function(item) {
                if (isMarqueur(item)) return false;
                if (typeFilter === 'tiroir') return isTiroir(item);
                return !isTiroir(item);
            });
        });

        if (filteredOrders.length === 0) {
            var msg = typeFilter === 'tiroir'
                ? 'Aucune commande de tiroirs trouvée dans la plage.'
                : 'Aucune commande avec articles non-tiroirs trouvée dans la plage.';
            showStatus('error', msg);
        } else {
            window._currentTypeFilter = typeFilter;
            afficherCommandes(filteredOrders);
            var typeLabel = typeFilter === 'tiroir' ? 'tiroirs' : 'autres articles';
            showStatus('success', filteredOrders.length + ' commande(s) avec ' + typeLabel + ' trouvée(s) sur ' + validOrders.length + ' commande(s) chargée(s).');
        }
    })
    .finally(function() { btn.disabled = false; btn.innerHTML = btnLabel; });
}

function getGroupe(item) {
    if (item.custom_field_hash && item.custom_field_hash.cf_groupe !== undefined) {
        return String(item.custom_field_hash.cf_groupe);
    }
    if (item.item_custom_fields) {
        for (var i = 0; i < item.item_custom_fields.length; i++) {
            var cf = item.item_custom_fields[i];
            if (cf.api_name === 'cf_groupe') return String(cf.value);
        }
    }
    return '';
}

function isMarqueur(item) {
    var desc = item.description || '';
    if (desc.indexOf('=#CLIENT') === 0) return true;
    if (desc.charCodeAt(0) === 8212) return true;
    if (getGroupe(item) === GROUPE_MARQUEUR) return true;
    return false;
}

function isTiroir(item) { return getGroupe(item) === GROUPE_TIROIR; }

function fractionToDecimal(str) {
    if (!str) return NaN;
    str = String(str).trim();
    var match = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
    if (match) return parseInt(match[1]) + parseInt(match[2]) / parseInt(match[3]);
    match = str.match(/^(\d+)\/(\d+)$/);
    if (match) return parseInt(match[1]) / parseInt(match[2]);
    return parseFloat(str);
}

function parseTiroirDimensions(desc) {
    if (!desc) return null;
    var pattern = /=\s*(\d+(?:\s+\d+\/\d+)?(?:\/\d+)?)\s*X\s*(\d+(?:\s+\d+\/\d+)?(?:\/\d+)?)\s*L\s*X\s*(\d+(?:\s+\d+\/\d+)?(?:\/\d+)?)\s*P/i;
    var m = desc.match(pattern);
    if (!m) return null;
    var h = fractionToDecimal(m[1]);
    var l = fractionToDecimal(m[2]);
    var p = fractionToDecimal(m[3]);
    if (isNaN(h) || isNaN(l) || isNaN(p)) return null;
    return { hauteur: h, largeur: l, profondeur: p };
}

function getSortedLineItems(line_items) {
    var indexed = line_items.map(function(item, i) { return { item: item, origIndex: i }; });
    var nonMarqueurs = indexed.filter(function(x) { return !isMarqueur(x.item); });
    var allTiroirs = nonMarqueurs.length > 0 && nonMarqueurs.every(function(x) { return isTiroir(x.item); });

    if (!allTiroirs) return indexed;

    var marqueurs = indexed.filter(function(x) { return isMarqueur(x.item); });
    var tiroirs = indexed.filter(function(x) { return !isMarqueur(x.item); });

    tiroirs.sort(function(a, b) {
        var dimA = parseTiroirDimensions(a.item.description || '');
        var dimB = parseTiroirDimensions(b.item.description || '');
        if (!dimA && !dimB) return 0;
        if (!dimA) return 1;
        if (!dimB) return -1;
        if (dimA.profondeur !== dimB.profondeur) return dimA.profondeur - dimB.profondeur;
        if (dimA.largeur !== dimB.largeur) return dimA.largeur - dimB.largeur;
        return dimA.hauteur - dimB.hauteur;
    });

    return marqueurs.concat(tiroirs);
}

function afficherCommandes(orders) {
    var container = document.getElementById('ordersContainer');
    container.innerHTML = '';
    var totalCommandes = 0;
    orders.forEach(function(so, orderIdx) {
        if (!so) return;
        totalCommandes++;
        container.appendChild(buildOrderCard(so, orderIdx));
    });
    if (totalCommandes > 0) {
        document.getElementById('globalActions').style.display = 'flex';
        document.getElementById('legendBox').style.display = 'flex';
        showStatus('success', totalCommandes + ' commande(s) chargée(s).');
    }
}

function buildOrderCard(so, orderIdx) {
    var card = document.createElement('div');
    card.className = 'order-card';
    card.dataset.orderIdx = orderIdx;

    var nbItems = so.line_items.reduce(function(total, item) {
        if (isMarqueur(item)) return total;
        return total + (parseInt(item.quantity) || 0);
    }, 0);

    var header = '<div class="order-card-header">' +
        '<div><div class="order-num">Commande ' + so.salesorder_number + '</div>' +
        '<div class="order-meta">' + escapeHtml(so.customer_name) + (so.reference_number ? ' &nbsp;•&nbsp; Réf : ' + escapeHtml(so.reference_number) : '') + '</div></div>' +
        '<div class="order-count">' + nbItems + ' item' + (nbItems > 1 ? 's' : '') + '</div></div>';

    var tableHtml = '<table class="items-table"><thead><tr>' +
        '<th style="width:40px; text-align:center;">Sél.</th>' +
        '<th style="width:80px;">Type</th>' +
        '<th>Item / Description</th>' +
        '<th style="width:55px;">Qté</th>' +
        '<th style="width:100px;">Qté étiq.</th>' +
        '</tr></thead><tbody>';

    var sortedItems = getSortedLineItems(so.line_items);
    var typeFilter = window._currentTypeFilter;

    sortedItems.forEach(function(entry) {
        var item = entry.item;
        var lineIdx = entry.origIndex;
        if (isMarqueur(item)) return;
        var tiroir = isTiroir(item);

        if (typeFilter === 'tiroir' && !tiroir) return;
        if (typeFilter === 'autre' && tiroir) return;

        var desc = item.description || '';
        var qty = parseInt(item.quantity) || 1;
        var hasDessin = desc.toLowerCase().indexOf('dessin') >= 0;

        var qteEtiqValeur = tiroir ? qty : '';
        var qteEtiqClass = tiroir ? 'qte-tiroir' : 'qte-simple';
        var rowClass = tiroir ? 'tiroir-row' : 'simple-row';
        var typeTag = tiroir
            ? '<span class="tag tag-tiroir">Tiroir</span>'
            : '<span class="tag tag-simple">Autre</span>';
        var placeholder = tiroir ? '' : 'placeholder="?"';

        tableHtml += '<tr class="' + rowClass + '">' +
            '<td style="text-align:center;"><input type="checkbox" class="item-check" data-order="' + orderIdx + '" data-line="' + lineIdx + '" checked></td>' +
            '<td>' + typeTag + '</td>' +
            '<td><div class="item-name">' + escapeHtml(desc) + '</div>' + (hasDessin ? '<div class="item-dessin">Voir dessin</div>' : '') + '</td>' +
            '<td style="font-weight:600;">' + qty + '</td>' +
            '<td><input type="number" class="qte-input ' + qteEtiqClass + '" data-order="' + orderIdx + '" data-line="' + lineIdx + '" value="' + qteEtiqValeur + '" min="0" max="999" ' + placeholder + '></td>' +
            '</tr>';
    });

    tableHtml += '</tbody></table>';
    card.innerHTML = header + tableHtml;
    card._so = so;
    return card;
}

function toutSelectionner()   { document.querySelectorAll('.item-check').forEach(function(cb) { cb.checked = true; }); }
function toutDeselectionner() { document.querySelectorAll('.item-check').forEach(function(cb) { cb.checked = false; }); }

function parseDescription(desc) {
    var idx = desc.lastIndexOf(' -');
    var itemName, options;
    if (idx > 0) {
        itemName = desc.substring(0, idx).trim();
        options  = desc.substring(idx + 2).trim();
    } else {
        itemName = desc;
        options  = '';
    }
    itemName = itemName.replace(/^\d+[A-Z]+\d+\s*-\s*/, '');
    return { itemName: itemName, options: options };
}

function parseClientMarker(desc) {
    var code = desc.substring(9).trim();
    if (/^[A-Za-z]{2}-/.test(code)) {
        var parts = code.split('-');
        if (parts.length >= 3) {
            return { refClient: parts.slice(0, 2).join('-'), sousPO: parts.slice(2).join('-') };
        }
    }
    return { refClient: code, sousPO: '' };
}

function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function buildLabelsForOrder(so, orderIdx) {
    var totalItems = so.line_items.reduce(function(total, item) {
        if (isMarqueur(item)) return total;
        return total + (parseInt(item.quantity) || 0);
    }, 0);

    var contextByLine = {};
    var refClientCourant = '', sousPOCourant = '';
    so.line_items.forEach(function(item, i) {
        var d = item.description || '';
        if (d.indexOf('=#CLIENT=') === 0) {
            var parsed = parseClientMarker(d);
            refClientCourant = parsed.refClient;
            sousPOCourant    = parsed.sousPO;
            return;
        }
        if (isMarqueur(item)) return;
        contextByLine[i] = { refClient: refClientCourant, sousPO: sousPOCourant };
    });

    var labelsHtml = '', labelCount = 0;
    var sortedItems = getSortedLineItems(so.line_items);
    var typeFilter = window._currentTypeFilter;

    sortedItems.forEach(function(entry) {
        var item = entry.item;
        var lineIdx = entry.origIndex;
        if (isMarqueur(item)) return;

        var tiroir = isTiroir(item);
        if (typeFilter === 'tiroir' && !tiroir) return;
        if (typeFilter === 'autre' && tiroir) return;

        var checkbox = document.querySelector('.item-check[data-order="' + orderIdx + '"][data-line="' + lineIdx + '"]');
        if (!checkbox || !checkbox.checked) return;

        var qteInput = document.querySelector('.qte-input[data-order="' + orderIdx + '"][data-line="' + lineIdx + '"]');
        var nbEtiq = parseInt(qteInput.value) || 0;
        if (nbEtiq <= 0) return;

        var desc = item.description || '';
        var ctx = contextByLine[lineIdx] || { refClient: '', sousPO: '' };
        var parsed = parseDescription(desc);

        // BUG FIX : recherche dans toute la description
        var logo   = hasOption(desc, 'logo')   ? 'Oui' : 'Non';
        var clips  = (hasOption(desc, 'clip')  || hasOption(desc, 'clips'))  ? 'Oui' : 'Non';
        var vernis = hasOption(desc, 'vernis') ? 'Oui' : 'Non';

        for (var n = 0; n < nbEtiq; n++) {
            labelCount++;
            labelsHtml +=
                '<div class="apercu-label">' +
                '<div class="label-body">' +
                '<div class="row row-top"><span class="k">Commande :</span><span class="v vbig">' + so.salesorder_number + '</span><span class="k ml">Total items/commande :</span><span class="v vbig">' + totalItems + '</span></div>' +
                '<div class="row"><span class="k">Client :</span><span class="v">' + escapeHtml(so.customer_name) + '</span></div>' +
                '<div class="row"><span class="k">R\u00e9f. client :</span><span class="v">' + escapeHtml(ctx.refClient) + '</span></div>' +
                '<div class="row"><span class="k">Sous-PO :</span><span class="v">' + escapeHtml(ctx.sousPO) + '</span></div>' +
                '<div class="row row-item"><span class="k">Item :</span><span class="v item-v">' + escapeHtml(parsed.itemName) + '</span></div>' +
                (parsed.options ? '<div class="row row-item"><span class="k">Options :</span><span class="v item-v">' + escapeHtml(parsed.options) + '</span></div>' : '') +
                '</div>' +
                '<div class="label-footer">' +
                '<div class="flags"><span><b>Logo :</b> ' + logo + '</span><span><b>Clips :</b> ' + clips + '</span><span><b>Vernis :</b> ' + vernis + '</span></div>' +
                '<div class="made">Fabriqu\u00e9 au Canada / Made in Canada</div>' +
                '<div class="nbitem">Nb item: ' + nbEtiq + '</div>' +
                '</div></div>';
        }
    });

    return { html: labelsHtml, count: labelCount };
}

function imprimerMaintenant() {
    var btn = document.getElementById('btnPrintNow');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Impression...';

    var apercuHtml = document.getElementById('apercuLabels').innerHTML;
    var printHtml = apercuHtml.replace(/class="apercu-label"/g, 'class="label"');
    printHtml = printHtml.replace(/<div class="apercu-num">[^<]*<\/div>/g, '');
    document.getElementById('printArea').innerHTML = printHtml;

    setTimeout(function() {
        window.print();
        setTimeout(function() {
            btn.disabled = false;
            btn.innerHTML = 'Imprimer maintenant';
        }, 500);
    }, 300);
}

function fermerApercu() {
    document.getElementById('apercuContainer').style.display = 'none';
    document.getElementById('apercuLabels').innerHTML = '';
    document.getElementById('ordersContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function genererApercu() {
    var allLabelsHtml = '';
    var totalLabels = 0;
    var labelNum = 0;

    document.querySelectorAll('.order-card').forEach(function(card) {
        var orderIdx = parseInt(card.dataset.orderIdx);
        var so = card._so;
        if (!so) return;
        var built = buildLabelsForOrder(so, orderIdx);
        var numbered = '';
        var labelMatches = built.html.match(/<div class="apercu-label">[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/g) || [];
        labelMatches.forEach(function(labelHtml) {
            labelNum++;
            numbered += '<div class="apercu-num">Étiquette ' + labelNum + ' &nbsp;—&nbsp; Commande ' + so.salesorder_number + '</div>' + labelHtml;
        });
        allLabelsHtml += numbered;
        totalLabels += built.count;
    });

    if (totalLabels === 0) {
        alert('Aucune étiquette à imprimer.\n\nVérifiez que :\n• Au moins une ligne est cochée\n• Les lignes « Autre » ont une quantité saisie');
        return;
    }

    document.getElementById('apercuLabels').innerHTML = allLabelsHtml;
    document.getElementById('totalCount').textContent = '(' + totalLabels + ' étiquette' + (totalLabels > 1 ? 's' : '') + ')';
    document.getElementById('apercuContainer').style.display = 'block';

    setTimeout(function() {
        document.getElementById('apercuContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function showStatus(type, msg) {
    var el = document.getElementById('searchStatus');
    el.className = 'status ' + type;
    el.innerHTML = msg;
    el.style.display = 'flex';
}
</script>
