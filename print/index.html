<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>🖨️ Impression JONH</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 600px;
    margin: 60px auto;
    padding: 30px;
    text-align: center;
    color: #222;
  }
  h1 {
    color: #5b8c1f;
    border-bottom: 3px solid #5b8c1f;
    padding-bottom: 15px;
    margin-bottom: 30px;
  }
  .card {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .so {
    font-size: 28px;
    font-weight: bold;
    color: #1976d2;
    margin: 20px 0;
    font-family: "Consolas", monospace;
  }
  .loading {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 4px solid #eee;
    border-top: 4px solid #5b8c1f;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px 0;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  button {
    background: #5b8c1f;
    color: white;
    padding: 12px 30px;
    border: 0;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
  }
  button:hover { background: #4a7318; }
  .info {
    color: #666;
    font-size: 14px;
    margin-top: 20px;
  }
  .error {
    color: #d32f2f;
    margin-top: 15px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🖨️ Impression JONH</h1>
  
  <div id="content-valid" style="display:none;">
    <p>Ouverture de la commande :</p>
    <div class="so" id="so-display"></div>
    <div class="loading"></div>
    <p class="info">Bluebeam va s'ouvrir automatiquement...</p>
    <p class="info">Si rien ne se passe, clique le bouton ci-dessous.</p>
    <button id="btn-retry">🖨️ Ouvrir Bluebeam</button>
  </div>
  
  <div id="content-invalid" style="display:none;">
    <p class="error">⚠️ Aucun numéro de commande fourni</p>
    <p class="info">Utilise l'URL : <code>?so=165243</code></p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const so = params.get('so');
  
  if (so && /^\d+$/.test(so)) {
    // Numéro valide
    document.getElementById('content-valid').style.display = 'block';
    document.getElementById('so-display').textContent = 'SO-' + so;
    
    const protocolUrl = 'jonh-print://' + so;
    
    // Déclenche le protocole immédiatement
    window.location.href = protocolUrl;
    
    // Bouton de secours si ça ne démarre pas tout seul
    document.getElementById('btn-retry').addEventListener('click', () => {
      window.location.href = protocolUrl;
    });
  } else {
    // Pas de numéro valide
    document.getElementById('content-invalid').style.display = 'block';
  }
</script>
</body>
</html>
